<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
<title id="title">De la compréhension à un projet concret</title>
<desc id="desc">Trois formes abstraites apparaissent successivement puis convergent vers une application finalisée.</desc>
<style>
  .label{font:500 17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#7294a8;text-anchor:middle}
  .stage{opacity:0;animation:appear 9s infinite}
  .s1{animation-delay:0s}.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
  .link{stroke:#6195aa;stroke-width:2;stroke-dasharray:5 8;opacity:0;animation:appear 9s infinite 1.6s}
  .project{opacity:0;transform-origin:725px 77px;animation:project 9s infinite}
  .pulse{fill:#46cbb3;opacity:0;animation:pulse 9s infinite}
  @keyframes appear{0%,4%{opacity:0}12%,64%{opacity:1}75%,100%{opacity:0}}
  @keyframes project{0%,37%{opacity:0;transform:scale(.72)}48%,83%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(.92)}}
  @keyframes pulse{0%,48%{opacity:0}53%,68%{opacity:1}75%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.stage,.link,.project{animation:none;opacity:1}.pulse{animation:none;opacity:0}}
</style>
<g fill="none" stroke="#6395aa" stroke-width="2.5" stroke-linejoin="round">
 <g class="stage s1"><rect x="70" y="28" width="110" height="100" rx="22" stroke-opacity=".25"/><path d="M125 42 159 78 125 114 91 78Z"/><circle cx="125" cy="78" r="9" fill="#46cbb3" stroke="none"/><text class="label" x="125" y="157" stroke="none">Explorer</text></g>
 <path class="link" d="M185 78H245"/>
 <g class="stage s2"><rect x="250" y="28" width="110" height="100" rx="22" stroke-opacity=".25"/><path d="M274 53h62v50h-62zM305 53v50M274 78h62"/><text class="label" x="305" y="157" stroke="none">Structurer</text></g>
 <path class="link" d="M365 78H425"/>
 <g class="stage s3"><rect x="430" y="28" width="110" height="100" rx="22" stroke-opacity=".25"/><path d="m485 45 33 19v30l-33 19-33-19V64zM452 64l33 19 33-19M485 83v30"/><text class="label" x="485" y="157" stroke="none">Construire</text></g>
 <path class="link" d="M545 78H645"/>
 <g class="project"><rect x="653" y="21" width="145" height="112" rx="17" stroke="#46cbb3" stroke-width="3"/><path d="M653 48h145"/><circle cx="670" cy="35" r="4" fill="#46cbb3" stroke="none"/><circle cx="683" cy="35" r="4" fill="#6395aa" stroke="none"/><rect x="670" y="62" width="49" height="52" rx="6" stroke-opacity=".65"/><path d="M731 67h49M731 82h33M731 97h42" stroke-opacity=".7"/><path d="m683 88 10 10 16-21" stroke="#46cbb3" stroke-width="4" stroke-linecap="round"/><text class="label" x="725" y="157" stroke="none" fill="#46cbb3">Projet concret</text></g>
</g>
<circle class="pulse" cx="725" cy="78" r="54" fill-opacity=".08"/>
</svg>
